name: Deploy Junktris V58 + V59 Candidate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify preserved V58
        run: test -f v58-junktris-final.html

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp v58-junktris-final.html _site/index.html
          python3 scripts/build_v59_candidate.py v58-junktris-final.html _site/v59-test.html
          if [ -f inventory-audit.html ]; then cp inventory-audit.html _site/inventory-audit.html; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5