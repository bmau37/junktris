name: Build Junktris Android

on:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - "v58-junktris-final.html"
      - "scripts/build_v59_candidate.py"
      - "scripts/build_v59_candidate_fixed.py"
      - "scripts/build_v59_audio_probe.py"
      - "scripts/build_v59_pwa.py"
      - "scripts/build_v60_difficulty.py"
      - "scripts/build_v60_difficulty_fixed.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: junktris-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build locked V60 into Android assets
        run: |
          mkdir -p android-app/app/src/main/assets/junktris
          python3 scripts/build_v60_difficulty_fixed.py v58-junktris-final.html android-app/app/src/main/assets/junktris/index.html
          test -s android-app/app/src/main/assets/junktris/index.html

      - name: Build debug APK
        id: apkbuild
        continue-on-error: true
        working-directory: android-app
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/junktris-apk-build.log

      - name: Build release app bundle
        id: bundlebuild
        if: steps.apkbuild.outcome == 'success'
        continue-on-error: true
        working-directory: android-app
        run: |
          set -o pipefail
          gradle :app:bundleRelease --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/junktris-bundle-build.log

      - name: Publish visible debug build result
        if: always()
        run: |
          mkdir -p downloads
          if [ "${{ steps.apkbuild.outcome }}" = "success" ] && [ -f android-app/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Junktris-Android-Test.apk
            if [ "${{ steps.bundlebuild.outcome }}" = "success" ]; then
              printf 'JUNKTRIS ANDROID BUILD: PASS — LOCKED V60 EMBEDDED — AAB BUILT\n' > downloads/android-build-status.txt
            else
              printf 'JUNKTRIS ANDROID BUILD: APK PASS — LOCKED V60 EMBEDDED — AAB FAILED\n\n' > downloads/android-build-status.txt
              if [ -f /tmp/junktris-bundle-build.log ]; then tail -n 120 /tmp/junktris-bundle-build.log >> downloads/android-build-status.txt; fi
            fi
          else
            rm -f downloads/Junktris-Android-Test.apk
            printf 'JUNKTRIS ANDROID BUILD: APK FAILED\n\n' > downloads/android-build-status.txt
            if [ -f /tmp/junktris-apk-build.log ]; then tail -n 180 /tmp/junktris-apk-build.log >> downloads/android-build-status.txt; fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- downloads/Junktris-Android-Test.apk downloads/android-build-status.txt
          if git diff --cached --quiet; then
            echo "Build result unchanged."
          else
            git commit -m "Record locked V60 Android build result [skip ci]"
            git push
          fi

      - name: Stage unsigned Play bundle
        if: steps.bundlebuild.outcome == 'success'
        run: |
          test -f android-app/app/build/outputs/bundle/release/app-release.aab
          cp android-app/app/build/outputs/bundle/release/app-release.aab /tmp/Junktris-Play-Unsigned.aab

      - name: Upload APK artifact
        if: steps.apkbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Junktris-Android-V60-Test
          path: downloads/Junktris-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Play bundle artifact
        if: steps.bundlebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Junktris-Play-Unsigned-AAB
          path: /tmp/Junktris-Play-Unsigned.aab
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow if APK build failed
        if: steps.apkbuild.outcome != 'success'
        run: exit 1

      - name: Fail workflow if bundle build failed
        if: steps.apkbuild.outcome == 'success' && steps.bundlebuild.outcome != 'success'
        run: exit 1
