name: Build V59 Candidate

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_v59_candidate.py"
      - ".github/workflows/build-v59.yml"
      - "v58-junktris-final.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build candidate and record result
        shell: bash
        run: |
          set +e
          python3 scripts/build_v59_candidate.py v58-junktris-final.html v59-test.html > v59-build.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            printf 'V59 BUILD OK\n' > v59-build-status.txt
            cat v59-build.log >> v59-build-status.txt
            rm -f v59-build-error.txt
          else
            printf 'V59 BUILD FAILED (exit %s)\n' "$status" > v59-build-error.txt
            cat v59-build.log >> v59-build-error.txt
            printf 'V59 BUILD FAILED\n' > v59-build-status.txt
            rm -f v59-test.html
          fi
          rm -f v59-build.log

      - name: Commit visible build result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- v59-test.html v59-build-status.txt v59-build-error.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate V59 candidate [skip ci]"
            git push
          fi
